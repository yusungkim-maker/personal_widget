<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>메모</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="memo.css">
</head>
<body>
  <div class="note" id="note">
    <header class="bar">
      <div class="colors" id="colors">
        <button data-c="yellow" title="노랑"></button>
        <button data-c="mint" title="민트"></button>
        <button data-c="sky" title="하늘"></button>
        <button data-c="pink" title="분홍"></button>
        <button data-c="lavender" title="보라"></button>
      </div>
      <div class="tools">
        <button class="tbtn" id="del" title="메모 삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>
        </button>
        <button class="tbtn" id="close" title="닫기 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
    <input id="title" class="title" placeholder="제목" maxlength="200" autocomplete="off">
    <textarea id="body" class="body" placeholder="내용을 적어 주세요. 자동으로 저장돼요." maxlength="20000"></textarea>
    <footer class="foot">
      <span id="status"></span>
      <span id="count"></span>
    </footer>
    <div class="confirm" id="confirm" hidden>한 번 더 누르면 삭제돼요</div>
  </div>
  <script src="memo.js"></script>
</body>
</html>
