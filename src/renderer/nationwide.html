<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>전국 날씨</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="nationwide.css">
</head>
<body>
  <div class="frame card">
    <header class="titlebar">
      <div class="title">
        <h1>전국 날씨</h1>
        <span id="updated" class="muted"></span>
      </div>
      <div class="seg" id="metric">
        <button data-v="now" class="on">현재 기온</button>
        <button data-v="max">오늘 최고</button>
        <button data-v="min">오늘 최저</button>
        <button data-v="pop">강수확률</button>
        <button data-v="tomorrow">내일</button>
      </div>
      <div class="tools">
        <button class="icon-btn" id="refresh" title="새로고침">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn close" id="close" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <section class="map-wrap">
        <div id="map" class="map"></div>
        <div id="status" class="status"></div>
      </section>
      <aside id="detail" class="detail"></aside>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="nationwide.js"></script>
</body>
</html>
